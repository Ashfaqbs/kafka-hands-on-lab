// Broker JAAS config — loaded by Kafka JVM via -Djava.security.auth.login.config
//
// KafkaServer block is required when any listener uses SASL.
// For SCRAM-SHA-512, no credentials go here — the broker fetches them from
// ZooKeeper at connection time (created by kafka-setup container).
//
// Mounted into the container via: volumes: ./kafka-config/kafka_server_jaas.conf:/etc/kafka/jaas.conf

KafkaServer {
    org.apache.kafka.common.security.scram.ScramLoginModule required;
};
